<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentiment Analyzer | Bean &amp; Leaf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Young+Serif&display=swap">
  <link rel="stylesheet" href="styles.css?v=7">
  <script type="module" src="app.js?v=7"></script>
</head>
<body>
  <main>
    <header>
      <p class="brand">Bean &amp; Leaf · customer feedback</p>
      <h1>Customer sentiment</h1>
    </header>

    <!-- Free field: classify one review, or add it to the dataset -->
    <form id="form">
      <label for="review">Write a review</label>
      <textarea id="review" rows="3" placeholder="The croissant was amazing."></textarea>
      <div class="actions">
        <select id="product" aria-label="Product"></select>
        <button type="submit" class="primary">Classify</button>
        <button type="button" id="add">Add to dataset</button>
      </div>
      <p id="status" role="status"></p>
    </form>

    <!-- Dataset report: filled in by app.js -->
    <section id="results" hidden>
      <div class="stats" id="stats"></div>

      <h2>Overall</h2>
      <div id="bars"></div>

      <h2>By product</h2>
      <table id="products"></table>

      <div class="row">
        <h2>Reviews</h2>
        <a id="download" download="feedback_report.md">Download report ↓</a>
      </div>
      <div class="scroll"><table id="table"></table></div>
    </section>
  </main>
</body>
</html>
