<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentiment Analyzer | Bean &amp; Leaf</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="brand">Bean &amp; Leaf</p>
      <h1>Customer sentiment</h1>
      <p class="muted">Pretrained RoBERTa model (Hugging Face) + Pandas.</p>
    </header>

    <!-- Free field: classify one review, or add it to the dataset -->
    <form id="form" class="card">
      <label for="review">Write a review</label>
      <div class="fields">
        <textarea id="review" rows="2" placeholder="The croissant was amazing."></textarea>
        <select id="product" aria-label="Product"></select>
      </div>
      <div class="actions">
        <button type="submit" class="primary">Classify</button>
        <button type="button" id="add">Add to dataset</button>
        <p id="status" role="status"></p>
      </div>
    </form>

    <!-- Dataset report: filled in by app.js -->
    <section id="results" hidden>
      <p class="muted" id="source"></p>
      <div class="stats" id="stats"></div>
      <div class="card" id="bars"></div>

      <div class="card">
        <h2>By product</h2>
        <table id="products"></table>
      </div>

      <div class="card">
        <div class="row">
          <h2>Reviews</h2>
          <a id="download" download="feedback_report.md">Download report</a>
        </div>
        <div class="scroll"><table id="table"></table></div>
      </div>
    </section>
  </main>
</body>
</html>
