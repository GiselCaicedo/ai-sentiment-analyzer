server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  types {
    text/html                 html;
    text/css                  css;
    application/javascript    js;
    font/ttf                  ttf;
    text/csv                  csv;
    application/json          json;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
